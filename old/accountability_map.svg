<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">The Chicago police accountability system</title>
  <desc id="map-desc">A diagram showing how Chicago voters elect 22 District Councils, which nominate the seven-member Community Commission for Public Safety and Accountability. The Commission short-lists candidates for the Superintendent and Police Board (appointed by the Mayor) and selects the COPA Chief (confirmed by City Council). Below, COPA and the Bureau of Internal Affairs investigate misconduct in parallel and refer discipline to the Superintendent, with the Police Board hearing termination cases and resolving conflicts between COPA and the Superintendent.</desc>

  <style>
    svg { background: #F2EDE4; }
    .map__box { fill: #F2EDE4; stroke: #15130F; stroke-width: 1.25; }
    .map__box--strong { stroke-width: 2; fill: #E8E2D5; }
    .map__box--inner { fill: rgba(21, 19, 15, 0.04); stroke-dasharray: 0; }
    .map__box--outer { fill: none; stroke: #15130F; stroke-width: 1; stroke-dasharray: 4 3; }
    .map__box--sidecar { fill: #E8E2D5; stroke: #15130F; stroke-width: 1; }

    .map__box-title {
      font-family: "Fraunces", "Times New Roman", serif;
      font-weight: 700;
      font-size: 14px;
      fill: #15130F;
      text-anchor: middle;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .map__box-title--lg { font-size: 22px; letter-spacing: 0.04em; }

    .map__box-sub {
      font-family: "JetBrains Mono", "Menlo", monospace;
      font-size: 10.5px;
      fill: #4A4640;
      text-anchor: middle;
      letter-spacing: 0.04em;
    }
    .map__box-sub--em { font-style: italic; fill: #15130F; }

    .map__container-label {
      font-family: "JetBrains Mono", "Menlo", monospace;
      font-size: 10px;
      fill: #15130F;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .map__tier-tag {
      font-family: "JetBrains Mono", "Menlo", monospace;
      font-size: 10px;
      fill: #7A7368;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .map__tier-name {
      font-family: "Fraunces", "Times New Roman", serif;
      font-size: 14px;
      fill: #4A4640;
      font-style: italic;
    }

    .map__arrow { fill: none; stroke: #15130F; stroke-width: 1.2; }
    .map__arrow--solid  { stroke: #15130F; }
    .map__arrow--dashed { stroke: #15130F; stroke-dasharray: 5 4; }
    .map__arrow--blood  { stroke: #7A1F1F; stroke-width: 1.4; }
    .map__arrow--thin   { stroke: #7A7368; stroke-width: 0.8; stroke-dasharray: 2 3; }

    .map__arrow-label {
      font-family: "JetBrains Mono", "Menlo", monospace;
      font-size: 10px;
      fill: #4A4640;
      letter-spacing: 0.04em;
    }
    .map__arrow-label--blood { fill: #7A1F1F; }
  </style>

  <defs>
    <marker id="arrow-ink" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#15130F"/>
    </marker>
    <marker id="arrow-blood" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#7A1F1F"/>
    </marker>
  </defs>

  <!-- TIER 1: civilian source -->
  <g class="map__tier-label" transform="translate(20,40)">
    <text class="map__tier-tag">TIER I</text>
    <text class="map__tier-name" y="16">Civilian source</text>
  </g>

  <!-- Voters -->
  <g transform="translate(420,18)">
    <rect class="map__box" width="160" height="44"/>
    <text class="map__box-title" x="80" y="20">CHICAGO VOTERS</text>
    <text class="map__box-sub"   x="80" y="34">~1.4M registered</text>
  </g>

  <!-- voters -> district councils -->
  <line class="map__arrow map__arrow--solid" x1="500" y1="64" x2="500" y2="96" marker-end="url(#arrow-ink)"/>
  <text class="map__arrow-label" x="510" y="84">elect 3 per district, every 4 yrs</text>

  <!-- District Councils -->
  <g transform="translate(380,98)">
    <rect class="map__box" width="240" height="50"/>
    <text class="map__box-title" x="120" y="22">22 DISTRICT COUNCILS</text>
    <text class="map__box-sub"   x="120" y="38">66 elected councilors</text>
  </g>

  <!-- district councils -> CCPSA -->
  <line class="map__arrow map__arrow--dashed" x1="500" y1="148" x2="500" y2="186" marker-end="url(#arrow-ink)"/>
  <text class="map__arrow-label" x="510" y="172">Nominating Committee</text>

  <!-- CCPSA -->
  <g transform="translate(360,190)">
    <rect class="map__box map__box--strong" width="280" height="74"/>
    <text class="map__box-title map__box-title--lg" x="140" y="26">CCPSA</text>
    <text class="map__box-sub"   x="140" y="44">Community Commission for</text>
    <text class="map__box-sub"   x="140" y="58">Public Safety &amp; Accountability — 7 seats</text>
  </g>

  <!-- TIER 2: political layer -->
  <g class="map__tier-label" transform="translate(20,330)">
    <text class="map__tier-tag">TIER II</text>
    <text class="map__tier-name" y="16">Political layer</text>
  </g>

  <!-- CCPSA -> Mayor (left fan) -->
  <path class="map__arrow map__arrow--dashed" d="M400,264 C300,300 240,310 220,338" fill="none" marker-end="url(#arrow-ink)"/>
  <text class="map__arrow-label" x="210" y="304" text-anchor="end">short-lists 3 for Supt.</text>
  <text class="map__arrow-label" x="210" y="318" text-anchor="end">+ Police Board nominees</text>

  <!-- CCPSA -> Council (right fan) -->
  <path class="map__arrow map__arrow--dashed" d="M600,264 C700,300 760,310 780,338" fill="none" marker-end="url(#arrow-ink)"/>
  <text class="map__arrow-label" x="790" y="304">selects COPA Chief</text>
  <text class="map__arrow-label" x="790" y="318">(subject to confirmation)</text>

  <!-- Mayor -->
  <g transform="translate(120,340)">
    <rect class="map__box" width="200" height="54"/>
    <text class="map__box-title" x="100" y="22">MAYOR</text>
    <text class="map__box-sub"   x="100" y="40">appoints · may veto policy</text>
  </g>

  <!-- City Council -->
  <g transform="translate(680,340)">
    <rect class="map__box" width="200" height="54"/>
    <text class="map__box-title" x="100" y="22">CITY COUNCIL</text>
    <text class="map__box-sub"   x="100" y="40">confirms · 2⁄3 override</text>
  </g>

  <!-- Mayor <-> Council link -->
  <line class="map__arrow map__arrow--thin" x1="320" y1="367" x2="680" y2="367"/>
  <text class="map__arrow-label" x="500" y="362" text-anchor="middle">confirmation &amp; budget</text>

  <!-- TIER 3: operating bodies -->
  <g class="map__tier-label" transform="translate(20,460)">
    <text class="map__tier-tag">TIER III</text>
    <text class="map__tier-name" y="16">Operating bodies</text>
  </g>

  <!-- Mayor -> CPD Supt -->
  <line class="map__arrow map__arrow--solid" x1="180" y1="394" x2="180" y2="468" marker-end="url(#arrow-ink)"/>
  <text class="map__arrow-label" x="190" y="418">appoints Supt.</text>

  <!-- Mayor -> Police Board (curve to center) -->
  <path class="map__arrow map__arrow--solid" d="M260,394 C320,420 420,440 480,468" fill="none" marker-end="url(#arrow-ink)"/>
  <text class="map__arrow-label" x="345" y="418">appoints Board members</text>

  <!-- Council -> COPA Chief -->
  <line class="map__arrow map__arrow--solid" x1="820" y1="394" x2="820" y2="468" marker-end="url(#arrow-ink)"/>
  <text class="map__arrow-label" x="830" y="418">confirms COPA Chief</text>

  <!-- CPD container (Supt + BIA) -->
  <g transform="translate(60,470)">
    <rect class="map__box map__box--outer" width="280" height="180"/>
    <text class="map__container-label" x="14" y="18">CHICAGO POLICE DEPT.</text>

    <!-- Superintendent -->
    <g transform="translate(20,32)">
      <rect class="map__box" width="240" height="54"/>
      <text class="map__box-title" x="120" y="22">SUPERINTENDENT</text>
      <text class="map__box-sub"   x="120" y="40">imposes discipline ≤ 30 days</text>
    </g>

    <!-- BIA -->
    <g transform="translate(20,104)">
      <rect class="map__box map__box--inner" width="240" height="60"/>
      <text class="map__box-title" x="120" y="22">BUREAU OF INTERNAL AFFAIRS</text>
      <text class="map__box-sub"   x="120" y="38">investigates: criminal misconduct,</text>
      <text class="map__box-sub"   x="120" y="50">theft, drug-planting, ops violations</text>
    </g>
  </g>

  <!-- Police Board -->
  <g transform="translate(380,470)">
    <rect class="map__box" width="240" height="180"/>
    <text class="map__box-title" x="120" y="26">POLICE BOARD</text>
    <text class="map__box-sub"   x="120" y="44">9 civilian members</text>
    <text class="map__box-sub"   x="120" y="78">Hears cases of:</text>
    <text class="map__box-sub"   x="120" y="94">• termination</text>
    <text class="map__box-sub"   x="120" y="110">• suspensions &gt; 30 days</text>
    <text class="map__box-sub"   x="120" y="126">• Supt./COPA disputes</text>
    <text class="map__box-sub map__box-sub--em" x="120" y="158">Does <tspan font-style="italic">not</tspan> supervise CPD.</text>
  </g>

  <!-- COPA -->
  <g transform="translate(660,470)">
    <rect class="map__box" width="280" height="180"/>
    <text class="map__box-title" x="140" y="26">COPA</text>
    <text class="map__box-sub"   x="140" y="44">Civilian Office of Police Accountability</text>
    <text class="map__box-sub"   x="140" y="78">Investigates 11 categories:</text>
    <text class="map__box-sub"   x="140" y="94">excessive force, shootings, sexual</text>
    <text class="map__box-sub"   x="140" y="110">misconduct, bias-based abuse, death</text>
    <text class="map__box-sub"   x="140" y="126">in custody, coercion, improper search,</text>
    <text class="map__box-sub"   x="140" y="142">domestic violence, pattern misconduct.</text>
  </g>

  <!-- Discipline arrows (blood) -->

  <!-- COPA -> Superintendent: recommends discipline -->
  <path class="map__arrow map__arrow--blood" d="M700,486 C520,460 360,460 280,498" fill="none" marker-end="url(#arrow-blood)"/>
  <text class="map__arrow-label map__arrow-label--blood" x="490" y="442" text-anchor="middle">COPA → Supt.: recommends discipline</text>

  <!-- Supt -> Police Board -->
  <line class="map__arrow map__arrow--blood" x1="322" y1="525" x2="378" y2="525" marker-end="url(#arrow-blood)"/>

  <!-- COPA -> Police Board -->
  <line class="map__arrow map__arrow--blood" x1="658" y1="582" x2="622" y2="582" marker-end="url(#arrow-blood)"/>

  <!-- CCPSA policy line -->
  <path class="map__arrow map__arrow--dashed" d="M640,225 C880,225 940,260 940,470" fill="none" marker-end="url(#arrow-ink)"/>
  <text class="map__arrow-label" x="940" y="212" text-anchor="end">policy: every General Order needs CCPSA majority</text>

  <!-- Federal sidecar -->
  <g transform="translate(20,680)">
    <rect class="map__box map__box--sidecar" width="960" height="60"/>
    <text class="map__container-label" x="14" y="18">FEDERAL OVERSIGHT (parallel)</text>
    <text class="map__box-sub" x="14" y="38">2019 consent decree · Independent Monitor (Maggie Hickey) ·</text>
    <text class="map__box-sub" x="14" y="52">Illinois Attorney General · reports to U.S. District Judge Rebecca Pallmeyer</text>
  </g>
</svg>
